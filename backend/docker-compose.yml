services:
  api:
    build: .
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      MODEL_BACKEND: ${MODEL_BACKEND:-mock}
    volumes:
      # mount trained ONNX without rebuilding: copy Colab export to backend/models/
      - ./models:/srv/models:ro
    restart: unless-stopped
