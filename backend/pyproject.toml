[project]
name = "voiceguard-backend"
version = "0.1.0"
description = "VoiceGuard streaming anti-spoofing backend (FastAPI + WS). Mock-first so UI starts Day 1."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "numpy>=1.26",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
full = [
  "torch>=2.3",
  "transformers>=4.44",
  "librosa>=0.10",
  "soundfile>=0.12",
  "onnxruntime>=1.18",
  "scikit-learn>=1.5",
]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
