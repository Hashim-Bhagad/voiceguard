[project]
name = "voiceguard-backend"
version = "0.1.0"
description = "VoiceGuard streaming anti-spoofing backend (FastAPI + WS). Mock-first so UI starts Day 1."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "numpy>=1.26",
  "python-multipart>=0.0.9",
  "firebase-admin>=6.5.0",
  # onnxruntime and soundfile are REQUIRED, not optional. They were previously in
  # the `full` extra, so a `uv sync` silently removed onnxruntime and the API fell
  # back to a development heuristic while still reporting model_ver
  # "aasist-l-indic-v0.1". Keep them here so the declared model backend can always
  # actually run.
  "onnxruntime>=1.18",
  "soundfile>=0.12",
]

[project.optional-dependencies]
# Speech-to-text for the linguistic-risk channel. Without it the transcript is
# empty and linguistic_score is always 0.0.
stt = [
  "groq>=0.11",
]
full = [
  "torch>=2.3",
  "transformers>=4.44",
  "librosa>=0.10",
  "scikit-learn>=1.5",
]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
