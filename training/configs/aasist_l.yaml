# Official ClovaAI AASIST-L adaptation for multilingual (Indic + English) anti-spoofing.
#
# Defaults are tuned for a CPU-only laptop. There is no Colab/GPU requirement:
# runtime.device=auto picks CUDA when present and falls back to CPU otherwise.
seed: 42
sample_rate: 16000

model:
  upstream_dir: third_party/aasist
  window_samples: 64600  # official AASIST-L input length at 16 kHz (~4.04 s)
  # Verbatim copy of model_config from upstream config/AASIST-L.conf. src/model.py
  # rejects any drift, because drift silently breaks loading AASIST-L.pth.
  architecture:
    architecture: AASIST
    nb_samp: 64600
    first_conv: 128
    filts: [70, [1, 32], [32, 32], [32, 24], [24, 24]]
    gat_dims: [24, 32]
    pool_ratios: [0.4, 0.5, 0.7, 0.5]
    temperatures: [2.0, 2.0, 100.0, 100.0]

runtime:
  device: auto          # auto | cpu | cuda
  # Torch intra-op threads for the model itself. Leave headroom for dataloader
  # workers; this box has 12 logical cores.
  num_threads: 8
  # Decoded-audio cache. First epoch pays FLAC decode + resample, later epochs
  # read float32 .npy instead. Set to null to disable.
  cache_dir: data/cache/waveforms

data:
  metadata_csv: data/metadata.csv
  train_split: train
  dev_split: dev
  test_split: test
  batch_size: 16
  num_workers: 3
  # Sample train batches inversely to (label x language) frequency. Without this,
  # a large English spoof corpus next to a smaller Indic bona-fide corpus makes
  # "English" and "spoof" correlated inside each batch.
  balanced_sampler: true
  balance_by: [label, language]

# Every transform below is applied independently of the label. Applying noise or
# codec effects to only one class would make the augmentation itself the
# discriminative feature.
augmentation:
  narrowband_prob: 0.40   # 16k -> 8k -> 16k telephony round trip
  noise_prob: 0.40
  rir_prob: 0.20
  gain_db: 3.0
  snr_db_range: [5.0, 20.0]
  frequency_mask: false
  # Optional real corpora. If these directories are absent, src/dataset.py warns
  # and substitutes synthetic coloured noise / a synthetic decaying-noise RIR, so
  # augmentation still happens rather than silently turning into a no-op.
  noise_dir: data/augmentation/musan
  rir_dir: data/augmentation/rirs

train:
  epochs: 30
  patience: 6
  lr: 0.0001            # upstream AASIST-L optim_config
  min_lr: 0.000005
  betas: [0.9, 0.999]
  amsgrad: false
  weight_decay: 0.0001
  class_weights: [1.0, 1.0]
  grad_clip_norm: 5.0
  grad_accum_steps: 1
  # Mixed precision is a CUDA feature here. On CPU it is ignored: bf16 autocast
  # without AVX512-BF16 is slower than fp32 on this hardware.
  mixed_precision: true
  out_dir: outputs/aasist_l_indic
  # Stop cleanly after this many hours so a laptop run can be resumed later with
  # --resume. 0 disables the budget.
  max_hours: 0
  # Log train loss every N optimiser steps.
  log_every: 25
